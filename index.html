<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Déclaration quotidienne MAXUS</title>
<style>
  :root {
    --navy: #1E2740;
    --navy-light: #2A3556;
    --cyan: #25CCF5;
    --cyan-dark: #12A8CC;
    --bg: #F4F6F9;
    --card: #FFFFFF;
    --text: #1E2740;
    --text-muted: #6B7690;
    --border: #E3E7EF;
    --error: #E14F4F;
    --success: #1FAE7A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 0 0 40px;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 28px 20px 24px;
    text-align: center;
  }
  header .logo-mark {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--cyan), var(--cyan-dark));
    margin: 0 auto 12px;
  }
  header h1 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 6px 0 0;
    color: #B7C0D8;
    font-size: 0.85rem;
  }
  #site-badge {
    display: inline-block;
    margin-top: 14px;
    background: rgba(37, 204, 245, 0.15);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: 600;
  }
  main {
    max-width: 480px;
    margin: -16px auto 0;
    padding: 0 16px;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 18px rgba(30, 39, 64, 0.08);
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 0 0 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  .field {
    margin-bottom: 16px;
  }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--navy);
  }
  label .req { color: var(--error); }
  input[type="number"], input[type="date"], textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
    background: #FBFCFE;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--cyan);
    background: white;
  }
  textarea { resize: vertical; min-height: 70px; }
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .financing-group {
    background: #F8FAFD;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .financing-group .fin-label {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }
  button {
    width: 100%;
    background: var(--navy);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--navy-light); }
  button:disabled { opacity: 0.6; cursor: default; }
  #status {
    text-align: center;
    padding: 12px;
    border-radius: 9px;
    margin-bottom: 16px;
    font-size: 0.9rem;
    font-weight: 600;
    display: none;
  }
  #status.success { display: block; background: rgba(31, 174, 122, 0.12); color: var(--success); }
  #status.error { display: block; background: rgba(225, 79, 79, 0.12); color: var(--error); }
  #status.missing-site { display: block; background: rgba(225, 79, 79, 0.12); color: var(--error); }
  .hint {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 4px;
  }
</style>
</head>
<body>

<header>
  <div class="logo-mark"></div>
  <h1>Déclaration quotidienne MAXUS</h1>
  <p>Suivi commercial &mdash; réseau distributeurs</p>
  <div id="site-badge">Chargement du site&hellip;</div>
</header>

<main>
  <div id="status"></div>

  <form id="declForm">
    <div class="card">
      <h2>Activité du jour</h2>
      <div class="field">
        <label for="date">Date <span class="req">*</span></label>
        <input type="date" id="date" required>
      </div>
      <div class="pair">
        <div class="field">
          <label for="affaires_ouvertes">Affaires ouvertes <span class="req">*</span></label>
          <input type="number" id="affaires_ouvertes" min="0" value="0" required>
        </div>
        <div class="field">
          <label for="offres_realisees">Offres réalisées <span class="req">*</span></label>
          <input type="number" id="offres_realisees" min="0" value="0" required>
        </div>
      </div>
      <div class="pair">
        <div class="field">
          <label for="potentiel_vu">Potentiel VU <span class="req">*</span></label>
          <input type="number" id="potentiel_vu" min="0" value="0" required>
        </div>
        <div class="field">
          <label for="commandes">Commandes <span class="req">*</span></label>
          <input type="number" id="commandes" min="0" value="0" required>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Financement</h2>
      <div class="financing-group">
        <div class="fin-label">CGI</div>
        <div class="pair">
          <div class="field">
            <label for="offre_cgi">Offre CGI</label>
            <input type="number" id="offre_cgi" min="0" value="0">
          </div>
          <div class="field">
            <label for="commandes_cgi">Commandes CGI</label>
            <input type="number" id="commandes_cgi" min="0" value="0">
          </div>
        </div>
      </div>
      <div class="financing-group">
        <div class="fin-label">ARVAL</div>
        <div class="pair">
          <div class="field">
            <label for="offre_arval">Offre ARVAL</label>
            <input type="number" id="offre_arval" min="0" value="0">
          </div>
          <div class="field">
            <label for="commandes_arval">Commandes ARVAL</label>
            <input type="number" id="commandes_arval" min="0" value="0">
          </div>
        </div>
      </div>
      <div class="field">
        <label for="commandes_autre">Commandes autre financement</label>
        <input type="number" id="commandes_autre" min="0" value="0">
      </div>
    </div>

    <div class="card">
      <h2>Commentaire</h2>
      <div class="field">
        <textarea id="commentaire" placeholder="Contexte, précisions (facultatif)"></textarea>
      </div>
    </div>

    <button type="submit" id="submitBtn">Envoyer la déclaration</button>
  </form>
</main>

<script>
  // Webhook Airtable (écriture sécurisée côté serveur, aucune clé API exposée ici)
  const WEBHOOK_URL = "https://hooks.airtable.com/workflows/v1/genericWebhook/appKWX9p1pug4SbKV/wflDx8MIDTC3poMKk/wtrFrUe2VTr2Tqb2Y";

  const params = new URLSearchParams(window.location.search);
  const site = params.get("site");
  const badge = document.getElementById("site-badge");
  const form = document.getElementById("declForm");
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");

  if (site) {
    badge.textContent = site;
  } else {
    badge.textContent = "Site non identifié";
    statusEl.className = "missing-site";
    statusEl.textContent = "Ce lien ne précise pas de site. Utilise le lien qui t'a été transmis par ton Directeur Régional.";
    submitBtn.disabled = true;
  }

  // Date du jour par défaut
  document.getElementById("date").value = new Date().toISOString().split("T")[0];

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!site) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Envoi en cours...";
    statusEl.className = "";
    statusEl.style.display = "none";

    const payload = {
      site: site,
      date: document.getElementById("date").value,
      affaires_ouvertes: Number(document.getElementById("affaires_ouvertes").value) || 0,
      offres_realisees: Number(document.getElementById("offres_realisees").value) || 0,
      potentiel_vu: Number(document.getElementById("potentiel_vu").value) || 0,
      commandes: Number(document.getElementById("commandes").value) || 0,
      offre_cgi: Number(document.getElementById("offre_cgi").value) || 0,
      commandes_cgi: Number(document.getElementById("commandes_cgi").value) || 0,
      offre_arval: Number(document.getElementById("offre_arval").value) || 0,
      commandes_arval: Number(document.getElementById("commandes_arval").value) || 0,
      commandes_autre: Number(document.getElementById("commandes_autre").value) || 0,
      commentaire: document.getElementById("commentaire").value || ""
    };

    try {
      await fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      // mode "no-cors" ne permet pas de lire la réponse : on considère l'envoi réussi
      // si aucune exception réseau n'a été levée.
      statusEl.className = "success";
      statusEl.textContent = "Déclaration enregistrée. Merci !";
      statusEl.style.display = "block";

      // Réinitialise les champs numériques pour permettre une nouvelle saisie le même jour
      form.querySelectorAll('input[type="number"]').forEach(el => el.value = 0);
      document.getElementById("commentaire").value = "";
      document.getElementById("date").value = new Date().toISOString().split("T")[0];

    } catch (err) {
      statusEl.className = "error";
      statusEl.textContent = "Erreur d'envoi. Vérifie ta connexion et réessaie.";
      statusEl.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Envoyer la déclaration";
    }
  });
</script>

</body>
</html>
